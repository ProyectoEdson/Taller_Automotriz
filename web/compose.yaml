services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: taller
      POSTGRES_PASSWORD: taller_dev_only
      POSTGRES_DB: taller_automotriz
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taller -d taller_automotriz"]
      interval: 2s
      timeout: 3s
      retries: 15
volumes:
  postgres_data:
