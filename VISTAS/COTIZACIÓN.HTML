
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cotización</title>

    <link rel="stylesheet" href="../CSS/AUTOMOTRIZ.CSS">
</head>

<body>

<div class="contenedor">

    <header class="encabezado">
        <h1>COTIZACIÓN</h1>
        <p>Generación de cotizaciones del taller automotriz</p>
    </header>

    <main class="contenido">

        <section class="seccion">

            <h2>Generar cotización</h2>

            <form id="formCotizacion">

                <div class="grupo-formulario">
                    <label for="orden">Seleccionar orden de servicio:</label>

                    <select id="orden" name="id_orden" required>
                        <option value="">Seleccione una orden</option>
                    </select>
                </div>

                <h3>Información de la orden</h3>

                <div class="grupo-formulario">
                    <label for="codigoOrden">Código de orden:</label>
                    <input type="text" id="codigoOrden" readonly>
                </div>

                <div class="grupo-formulario">
                    <label for="cliente">Cliente:</label>
                    <input type="text" id="cliente" readonly>
                </div>

                <div class="grupo-formulario">
                    <label for="vehiculo">Vehículo:</label>
                    <input type="text" id="vehiculo" readonly>
                </div>

                <div class="grupo-formulario">
                    <label for="placa">Placa:</label>
                    <input type="text" id="placa" readonly>
                </div>

                <h3>Detalle de servicios y repuestos</h3>

                <div class="tabla-contenedor">

                    <table id="tablaDetalles">

                        <thead>
                            <tr>
                                <th>Descripción</th>
                                <th>Tipo</th>
                                <th>Cantidad</th>
                                <th>Precio unitario</th>
                                <th>Total</th>
                                <th>Acción</th>
                            </tr>
                        </thead>

                        <tbody id="detalleCotizacion">

                        </tbody>

                    </table>

                </div>

                <button type="button" id="agregarDetalle">
                    Agregar detalle
                </button>

                <h3>Resumen de cotización</h3>

                <div class="grupo-formulario">
                    <label for="subtotal">Subtotal:</label>
                    <input type="number" id="subtotal" readonly value="0.00">
                </div>

                <div class="grupo-formulario">
                    <label for="impuesto">Impuesto (7 %):</label>
                    <input type="number" id="impuesto" readonly value="0.00">
                </div>

                <div class="grupo-formulario">
                    <label for="total">Total:</label>
                    <input type="number" id="total" readonly value="0.00">
                </div>

                <button type="submit" id="btnGenerar">
                    Generar cotización
                </button>

            </form>

            <p id="mensaje"></p>

        </section>

    </main>

</div>

<script>

const formulario = document.getElementById("formCotizacion");
const selectorOrden = document.getElementById("orden");
const tablaDetalles = document.getElementById("detalleCotizacion");

const subtotalInput = document.getElementById("subtotal");
const impuestoInput = document.getElementById("impuesto");
const totalInput = document.getElementById("total");

let ordenSeleccionada = null;

// Cargar órdenes disponibles

async function cargarOrdenes() {

    try {

        const respuesta = await fetch("../PHP/consultar_ordenes.php");
        const datos = await respuesta.json();

        if (!Array.isArray(datos)) {
            console.error("Formato de órdenes inesperado:", datos);
            return;
        }

        datos.forEach(orden => {

            const opcion = document.createElement("option");

            opcion.value = orden.id_orden;
            opcion.textContent = orden.codigo_orden;

            opcion.dataset.codigo = orden.codigo_orden;
            opcion.dataset.cliente = orden.cliente;
            opcion.dataset.vehiculo = orden.vehiculo;
            opcion.dataset.placa = orden.placa;

            selectorOrden.appendChild(opcion);

        });

    } catch (error) {

        console.error("Error al cargar las órdenes:", error);

    }

}

// Mostrar información de la orden seleccionada

selectorOrden.addEventListener("change", function () {

    const opcion = this.options[this.selectedIndex];

    if (!this.value) {

        document.getElementById("codigoOrden").value = "";
        document.getElementById("cliente").value = "";
        document.getElementById("vehiculo").value = "";
        document.getElementById("placa").value = "";

        ordenSeleccionada = null;

        return;
    }

    ordenSeleccionada = this.value;

    document.getElementById("codigoOrden").value =
        opcion.dataset.codigo || "";

    document.getElementById("cliente").value =
        opcion.dataset.cliente || "";

    document.getElementById("vehiculo").value =
        opcion.dataset.vehiculo || "";

    document.getElementById("placa").value =
        opcion.dataset.placa || "";

});

// Agregar una fila de detalle

function agregarDetalle() {

    const fila = document.createElement("tr");

    fila.innerHTML = `
        <td>
            <input type="text" class="descripcion" required>
        </td>

        <td>
            <select class="tipo">
                <option value="Servicio">Servicio</option>
                <option value="Repuesto">Repuesto</option>
            </select>
        </td>

        <td>
            <input type="number" class="cantidad" min="1" value="1" required>
        </td>

        <td>
            <input type="number" class="precio" min="0" step="0.01" value="0.00" required>
        </td>

        <td>
            <input type="number" class="total-item" value="0.00" readonly>
        </td>

        <td>
            <button type="button" class="eliminar">
                Eliminar
            </button>
        </td>
    `;

    tablaDetalles.appendChild(fila);

    fila.querySelector(".cantidad").addEventListener("input", calcularTotales);
    fila.querySelector(".precio").addEventListener("input", calcularTotales);

    fila.querySelector(".eliminar").addEventListener("click", function () {

        fila.remove();
        calcularTotales();

    });

}

// Botón para agregar detalles

document.getElementById("agregarDetalle").addEventListener("click", agregarDetalle);

// Calcular subtotal, impuesto y total

function calcularTotales() {

    let subtotal = 0;

    document.querySelectorAll("#detalleCotizacion tr").forEach(fila => {

        const cantidad =
            Number(fila.querySelector(".cantidad").value) || 0;

        const precio =
            Number(fila.querySelector(".precio").value) || 0;

        const totalItem = cantidad * precio;

        fila.querySelector(".total-item").value =
            totalItem.toFixed(2);

        subtotal += totalItem;

    });

    const impuesto = subtotal * 0.07;
    const total = subtotal + impuesto;

    subtotalInput.value = subtotal.toFixed(2);
    impuestoInput.value = impuesto.toFixed(2);
    totalInput.value = total.toFixed(2);

}

// Guardar cotización

formulario.addEventListener("submit", async function (evento) {

    evento.preventDefault();

    const mensaje = document.getElementById("mensaje");

    if (!ordenSeleccionada) {

        mensaje.textContent = "Debe seleccionar una orden de servicio.";
        return;

    }

    const filas = document.querySelectorAll("#detalleCotizacion tr");

    if (filas.length === 0) {

        mensaje.textContent = "Debe agregar al menos un detalle.";
        return;

    }

    const detalles = [];

    let datosValidos = true;

    filas.forEach(fila => {

        const descripcion =
            fila.querySelector(".descripcion").value.trim();

        const tipo =
            fila.querySelector(".tipo").value;

        const cantidad =
            Number(fila.querySelector(".cantidad").value);

        const precio =
            Number(fila.querySelector(".precio").value);

        if (!descripcion || cantidad <= 0 || precio < 0) {
            datosValidos = false;
            return;
        }

        detalles.push({

            descripcion: descripcion,
            tipo: tipo,
            cantidad: cantidad,
            precio_unitario: precio,
            total_item: cantidad * precio

        });

    });

    if (!datosValidos) {

        mensaje.textContent = "Revise los datos de los detalles.";
        return;

    }

    const datos = {

        id_orden: ordenSeleccionada,
        subtotal: Number(subtotalInput.value),
        impuesto: Number(impuestoInput.value),
        total: Number(totalInput.value),
        detalles: detalles

    };

    try {

        const respuesta = await fetch("../PHP/guardar_cotizacion.php", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify(datos)

        });

        const resultado = await respuesta.json();

        if (resultado.exito) {

            mensaje.textContent =
                resultado.mensaje || "Cotización guardada correctamente.";

            formulario.reset();

            tablaDetalles.innerHTML = "";

            ordenSeleccionada = null;

            calcularTotales();

            cargarOrdenes();

        } else {

            mensaje.textContent =
                resultado.mensaje || "No se pudo guardar la cotización.";

        }

    } catch (error) {

        console.error("Error al guardar:", error);

        mensaje.textContent =
            "No se pudo comunicar con el servidor.";

    }

});

// Inicializar

cargarOrdenes();

</script>

</body>
</html>
