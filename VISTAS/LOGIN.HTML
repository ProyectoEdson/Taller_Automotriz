
<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../CSS/AUTOMOTRIZ.CSS">

    <meta name="description" content="Acceso al Sistema de Gestión - Taller Automotriz">

    <title>Taller Automotriz - Iniciar Sesión</title>

</head>

<body class="login-body-wrapper">

    <main class="login-frame">

        <header class="login-header">

            <svg viewBox="0 0 80 65" class="auto" aria-hidden="true">
                <path d="M15 42 L20 17 Q22 7 32 7 H49 Q59 7 62 17 L67 42 V55 H56 V48 H24 V55 H13 V42 Z"/>
                <path d="M21 26 H61 M14 37 H24 M57 37 H67 M27 15 H54"/>
            </svg>

            <h2>TALLER AUTOMOTRIZ</h2>

            <p>Acceso al Sistema de Gestión</p>

        </header>

        <section class="login-content">

            <form id="loginForm">

                <label class="label-title">
                    <strong>Seleccione su Perfil de Agente</strong>
                </label>

                <div class="role-selector">

                    <label class="role-card">

                        <input
                            type="radio"
                            name="rol"
                            value="mecanico"
                            checked
                            onchange="actualizarAviso()"
                        >

                        <div class="role-box">

                            <svg width="22" height="22" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor"
                                stroke-width="2" aria-hidden="true">

                                <circle cx="12" cy="12" r="3"/>

                                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l-.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06-.06a1.65 1.65 0 0 0-.33 1.82V9c.26.604.852.997 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>

                            </svg>

                            <span>MECÁNICO</span>

                        </div>

                    </label>

                    <label class="role-card">

                        <input
                            type="radio"
                            name="rol"
                            value="recepcionista"
                            onchange="actualizarAviso()"
                        >

                        <div class="role-box">

                            <svg width="22" height="22" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor"
                                stroke-width="2" aria-hidden="true">

                                <circle cx="12" cy="8" r="4"/>

                                <path d="M4 20c0-4 4-6 8-6s8 2 8 6"/>

                            </svg>

                            <span>RECEPCIONISTA</span>

                        </div>

                    </label>

                </div>

                <div id="avisoRol" class="role-notice">

                    <strong>Acceso Compartido de Taller:</strong>
                    Cualquier mecánico autenticado puede consultar y dar
                    seguimiento a las órdenes de trabajo abiertas por otros compañeros.

                </div>

                <article>

                    <label for="usuario" class="label-title">
                        Usuario o Código de Agente
                    </label>

                    <input
                        type="text"
                        id="usuario"
                        name="usuario"
                        class="login-input"
                        placeholder="Ej. mec.carlos o rec.ana"
                        required
                        autocomplete="username"
                    >

                </article>

                <article>

                    <label for="password" class="label-title">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="login-input"
                        placeholder="••••••••"
                        required
                        autocomplete="current-password"
                    >

                </article>

                <button type="submit" class="btn-login" id="btnLogin">
                    INICIAR SESIÓN
                </button>

                <p id="mensajeLogin" role="alert"></p>

            </form>

        </section>

    </main>

    <script>

        // Actualizar el aviso según el perfil seleccionado

        function actualizarAviso() {

            const rol = document.querySelector(
                'input[name="rol"]:checked'
            ).value;

            const aviso = document.getElementById("avisoRol");

            if (rol === "mecanico") {

                aviso.innerHTML = `
                    <strong>Acceso Compartido de Taller:</strong>
                    Cualquier mecánico autenticado puede consultar y dar
                    seguimiento a las órdenes de trabajo abiertas por otros compañeros.
                `;

            } else {

                aviso.innerHTML = `
                    <strong>Acceso de Recepción:</strong>
                    El personal de recepción puede trabajar con las cotizaciones
                    y registrar los pagos de las órdenes de servicio.
                `;

            }

        }


        // Validar inicio de sesión mediante PHP

        document.getElementById("loginForm").addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();

                const formulario = this;

                const boton = document.getElementById("btnLogin");

                const mensaje = document.getElementById("mensajeLogin");

                const datos = new FormData(formulario);

                boton.disabled = true;
                boton.textContent = "VERIFICANDO...";

                mensaje.textContent = "";

                try {

                    const respuesta = await fetch(
                        "../PHP/validar_login.php",
                        {
                            method: "POST",
                            body: datos
                        }
                    );

                    const resultado = await respuesta.json();

                    if (!respuesta.ok || !resultado.exito) {

                        mensaje.textContent = resultado.mensaje ||
                            "No se pudo iniciar sesión.";

                        return;

                    }

                    alert("Inicio de sesión correcto. Redirigiendo...");

                    window.location.href = "./INICIO.php";

                } catch (error) {

                    mensaje.textContent =
                        "No se pudo conectar con el servidor.";

                } finally {

                    boton.disabled = false;
                    boton.textContent = "INICIAR SESIÓN";

                }

            }

        );

    </script>

</body>

</html>
