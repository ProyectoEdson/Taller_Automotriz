
<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Diagnóstico y Reparación</title>

    <link rel="stylesheet" href="../SOFTWARE- FASE 3/CSS/AUTOMOTRIZ.CSS">

</head>

<body>

<div class="contenedor">

    <header class="encabezado">

        <div class="logo">

            <svg viewBox="0 0 80 65" class="auto">
                <path d="M15 42 L20 17 Q22 7 32 7 H49 Q59 7 62 17 L67 42 V55 H56 V48 H24 V55 H13 V42 Z"/>
                <path d="M21 26 H61 M14 37 H24 M57 37 H67 M27 15 H54"/>
            </svg>

            <span>TALLER AUTOMOTRIZ</span>

        </div>

        <div class="usuario">

            <span class="user-role">
                <svg width="18" height="18" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round"
                    aria-hidden="true">
                    <circle cx="12" cy="8" r="4"/>
                    <path d="M4 20c0-4 4-6 8-6s8 2 8 6"/>
                </svg>

                MECÁNICO
            </span>

            <a href="../VISTAS/LOGIN.HTML" onclick="cerrarSesion(event)">
                CERRAR SESIÓN
            </a>

        </div>
    </header>


    <div class="estructura">


        <aside class="menu">

            <a href="../SOFTWARE- FASE 3/VISTAS/INICIO.HTML" class="opcion">

                <span class="icono">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="m3 10 9-7 9 7"/>
                        <path d="M5 9v11h14V9"/>
                        <path d="M9 20v-7h6v7"/>
                    </svg>
                </span>

                INICIO

            </a>


            <a href="../SOFTWARE- FASE 3/INDEX.HTML" class="opcion seleccionado">

                <span class="icono">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14.7 6.3a5 5 0 0 0-6.4 6.4L3 18l3 3 5.3-5.3a5 5 0 0 0 6.4-6.4l-3.1 3.1-3-3z"/>
                    </svg>
                </span>

                <span>DIAGNÓSTICO Y<br> REPARACIÓN</span>

            </a>

        </aside>


        <main class="contenido">


            <h1>REGISTRAR DIAGNÓSTICO Y REPARACIÓN</h1>


            <label for="ordenTrabajo">ORDEN DE TRABAJO</label>

            <input type="text" id="ordenTrabajo" value="AT-00025">


            <section class="informacion gris">

                <h3>INFORMACIÓN DEL VEHÍCULO</h3>


                <div class="datos-vehiculo">

                    <span>CLIENTE:</span>

                    <input type="text" id="cliente" value="JUAN PÉREZ">


                    <span>VEHÍCULO:</span>

                    <input type="text" id="vehiculo" value="TOYOTA COROLLA">


                    <span>PLACA:</span>

                    <input type="text" id="placa" value="ABC-123">

                </div>

            </section>


            <label for="diagnostico">DIAGNÓSTICO</label>

            <textarea id="diagnostico">El vehículo presenta problemas en los frenos.</textarea>


            <label for="reparaciones">Reparaciones realizadas</label>

            <textarea id="reparaciones">Cambio de pastilla de freno y revisión del sistema</textarea>


            <section class="repuestos">

                <label>Repuesto Utilizado</label>


                <table>

                    <thead>

                        <tr>

                            <th>Repuesto</th>

                            <th>Cantidad</th>

                            <th>Precio unitario</th>

                            <th>Total</th>

                        </tr>

                    </thead>


                    <tbody id="tablaRepuestos">

                        <tr>

                            <td>
                                <input type="text" class="nombre-repuesto" value="Pastilla de Freno">
                            </td>

                            <td>
                                <input type="number" class="cantidad-repuesto" value="1" min="1">
                            </td>

                            <td>
                                <input type="number" class="precio-repuesto" value="45.00" min="0" step="0.01">
                            </td>

                            <td class="total-repuesto">$ 45.00</td>

                        </tr>

                        <tr>

                            <td>
                                <input type="text" class="nombre-repuesto" value="Líquido de Freno">
                            </td>

                            <td>
                                <input type="number" class="cantidad-repuesto" value="1" min="1">
                            </td>

                            <td>
                                <input type="number" class="precio-repuesto" value="12.00" min="0" step="0.01">
                            </td>

                            <td class="total-repuesto">$ 12.00</td>

                        </tr>

                    </tbody>

                </table>


                <div class="acciones">

                    <button type="button" id="btnAgregarRepuesto">
                        Agregar Repuesto
                    </button>

                </div>

            </section>


            <div class="acciones">

                <button type="button" id="btnGuardarDiagnostico">
                    Guardar Diagnóstico
                </button>

            </div>


        </main>

    </div>

</div>


<script>

// =================================
// CERRAR SESIÓN
// =================================

function cerrarSesion(event) {

    event.preventDefault();

    localStorage.removeItem('agenteActivo');

    localStorage.removeItem('rolActivo');

    window.location.href = '../SOFTWARE- FASE 3/VISTAS/LOGIN.HTML';

}


// =================================
// REFERENCIAS DE LOS ELEMENTOS
// =================================

const tablaRepuestos = document.getElementById('tablaRepuestos');

const btnAgregarRepuesto = document.getElementById('btnAgregarRepuesto');

const btnGuardarDiagnostico = document.getElementById('btnGuardarDiagnostico');


// =================================
// CALCULAR TOTAL DE CADA REPUESTO
// =================================

function calcularTotal(fila) {

    const cantidad = Number(fila.querySelector('.cantidad-repuesto').value) || 0;

    const precio = Number(fila.querySelector('.precio-repuesto').value) || 0;

    const total = cantidad * precio;

    fila.querySelector('.total-repuesto').textContent = '$ ' + total.toFixed(2);

}


// =================================
// AGREGAR NUEVO REPUESTO
// =================================

function agregarRepuesto(nombre = '', cantidad = 1, precio = 0) {

    const fila = document.createElement('tr');

    fila.innerHTML = `
        <td>
            <input type="text" class="nombre-repuesto"
                placeholder="Nombre del repuesto">
        </td>

        <td>
            <input type="number" class="cantidad-repuesto"
                value="${cantidad}" min="1">
        </td>

        <td>
            <input type="number" class="precio-repuesto"
                value="${precio}" min="0" step="0.01">
        </td>

        <td class="total-repuesto">$ 0.00</td>
    `;

    fila.querySelector('.nombre-repuesto').value = nombre;

    tablaRepuestos.appendChild(fila);

    calcularTotal(fila);

}


// =================================
// EVENTO DEL BOTÓN AGREGAR REPUESTO
// =================================

btnAgregarRepuesto.addEventListener('click', function() {

    agregarRepuesto();

});


// =================================
// ACTUALIZAR LOS TOTALES AUTOMÁTICAMENTE
// =================================

tablaRepuestos.addEventListener('input', function(event) {

    if (
        event.target.classList.contains('cantidad-repuesto') ||
        event.target.classList.contains('precio-repuesto')
    ) {

        const fila = event.target.closest('tr');

        calcularTotal(fila);

    }

});


// =================================
// OBTENER LOS REPUESTOS
// =================================

function obtenerRepuestos() {

    const filas = tablaRepuestos.querySelectorAll('tr');

    const repuestos = [];

    filas.forEach(function(fila) {

        const nombre = fila.querySelector('.nombre-repuesto').value.trim();

        const cantidad = Number(fila.querySelector('.cantidad-repuesto').value);

        const precio = Number(fila.querySelector('.precio-repuesto').value);

        if (nombre !== '') {

            repuestos.push({
                nombre: nombre,
                cantidad: cantidad,
                precio: precio,
                total: cantidad * precio
            });

        }

    });

    return repuestos;

}


// =================================
// GUARDAR DIAGNÓSTICO
// =================================

function guardarDiagnostico() {

    const orden = document.getElementById('ordenTrabajo').value.trim();

    const cliente = document.getElementById('cliente').value.trim();

    const vehiculo = document.getElementById('vehiculo').value.trim();

    const placa = document.getElementById('placa').value.trim();

    const diagnostico = document.getElementById('diagnostico').value.trim();

    const reparaciones = document.getElementById('reparaciones').value.trim();

    const repuestos = obtenerRepuestos();


    if (!orden || !cliente || !vehiculo || !placa || !diagnostico || !reparaciones) {

        alert('Por favor, completa todos los campos antes de guardar.');

        return;

    }


    const datosDiagnostico = {

        orden: orden,

        cliente: cliente,

        vehiculo: vehiculo,

        placa: placa,

        diagnostico: diagnostico,

        reparaciones: reparaciones,

        repuestos: repuestos,

        fechaGuardado: new Date().toISOString()

    };


    let diagnosticos = JSON.parse(localStorage.getItem('diagnosticosTaller')) || [];


    const indice = diagnosticos.findIndex(function(item) {

        return item.orden === orden;

    });


    if (indice !== -1) {

        diagnosticos[indice] = datosDiagnostico;

    } else {

        diagnosticos.push(datosDiagnostico);

    }


    localStorage.setItem('diagnosticosTaller', JSON.stringify(diagnosticos));


    alert('¡Diagnóstico guardado correctamente!');

}


// =================================
// EVENTO DEL BOTÓN GUARDAR
// =================================

btnGuardarDiagnostico.addEventListener('click', guardarDiagnostico);


// =================================
// CARGAR DIAGNÓSTICO GUARDADO
// =================================

function cargarDiagnostico() {

    const orden = document.getElementById('ordenTrabajo').value.trim();

    const diagnosticos = JSON.parse(localStorage.getItem('diagnosticosTaller')) || [];

    const datos = diagnosticos.find(function(item) {

        return item.orden === orden;

    });


    if (!datos) {

        return;

    }


    document.getElementById('cliente').value = datos.cliente;

    document.getElementById('vehiculo').value = datos.vehiculo;

    document.getElementById('placa').value = datos.placa;

    document.getElementById('diagnostico').value = datos.diagnostico;

    document.getElementById('reparaciones').value = datos.reparaciones;


    tablaRepuestos.innerHTML = '';


    datos.repuestos.forEach(function(repuesto) {

        agregarRepuesto(
            repuesto.nombre,
            repuesto.cantidad,
            repuesto.precio
        );

    });

}


// =================================
// INICIAR FUNCIONES
// =================================

document.querySelectorAll('#tablaRepuestos tr').forEach(function(fila) {

    calcularTotal(fila);

});

cargarDiagnostico();

</script>


</body>
</html>
